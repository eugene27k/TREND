# PRD Section 14: the test pyramid, the coverage floor, and the cross-strategy
# isolation test (US-T01 AC 2) run in CI.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests tools
          ruff format --check src tests tools

      - name: Cross-strategy isolation (US-T01 AC 2)
        # Called out on its own because it is the guarantee that lets CARRY and
        # TREND share a schema; a regression here is silent data leakage.
        run: pytest tests/storage/test_isolation.py -q

      - name: Appendix C canonical vectors
        # The signal, volatility, sizing, governor and hysteresis numbers the PRD
        # pins. If these move, the strategy is not the one that was specified.
        run: pytest tests/signals tests/riskmodel tests/portfolio -q

      - name: Test suite with the Section 14 coverage floor
        run: |
          pytest tests -q \
            --cov=aegis.signals --cov=aegis.riskmodel --cov=aegis.portfolio \
            --cov=aegis.rebalance --cov=aegis.universe --cov=aegis.backtest_trend \
            --cov-report=term-missing --cov-fail-under=85

      - name: Self-verification report
        if: always()
        run: python tools/self_report.py --no-run --junit build/report.xml || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-report
          path: |
            SELF-REPORT.md
            build/report.xml
          if-no-files-found: ignore

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Build (TypeScript strict)
        run: npm run build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The compose file must be valid and declare both sleeves
        run: docker compose config --quiet
      - name: Build the image
        run: docker build -f ops/docker/Dockerfile -t aegis:ci .
      - name: The engine must come up and refuse an unconfirmed live start
        run: |
          docker run --rm aegis:ci --strategy trend --migrate-only --db /tmp/ci.db
          ! docker run --rm aegis:ci --strategy trend --mode live --db /tmp/ci.db
