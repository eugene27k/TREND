[project]
name = "aegis"
version = "1.0.0"
description = "Aegis trading orchestrator — CARRY (basis/funding) and TREND (time-series momentum) sleeves on Binance USDS-M perpetuals"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "httpx>=0.27",
    "websockets>=12.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = ["storage/migrations/*.sql", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (backtests, soaks)",
    "network: requires live network access (skipped by default)",
    "soak: paper-soak drills",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["aegis"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM108", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "B011"]
# PRD Appendix D specifies U+2212 MINUS SIGN, U+00B7 MIDDLE DOT and U+00D7
# MULTIPLICATION SIGN in the Telegram message formats. They are the spec, not typos.
"src/aegis/ops/reports.py" = ["RUF001", "RUF002"]
"tests/ops/test_reports.py" = ["RUF001", "RUF002"]
"tests/integration/test_acceptance.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
packages = ["aegis"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
